name: blindspot_app
description: "BlindSpot — household object detection for the visually impaired (Flutter rebuild)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.2.0
  tflite_flutter: 0.12.1
  camera: 0.12.0+2
  speech_to_text: 7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  wakelock_plus: 1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/
    - assets/audio/
    - assets/images/
